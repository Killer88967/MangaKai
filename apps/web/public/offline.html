<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=auto"
    />
    <meta name="theme-color" content="#0a0910" />

    <title>MangaKai Offline</title>

    <style>
      :root {
        color-scheme: dark;
        background: #0a0910;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: #0a0910;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0910;
        color: #f4f4f5;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      .container {
        width: min(100% - 32px, 800px);
        margin: 0 auto;
        padding: 48px 0;
      }

      .brand {
        color: #a78bfa;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 0;
        font-size: 36px;
        line-height: 1.1;
      }

      .muted {
        color: #a1a1aa;
      }

      .empty,
      .chapter {
        margin-top: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.025);
      }

      .empty {
        padding: 32px;
        text-align: center;
      }

      .chapter {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
      }

      .chapter-title {
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chapter-meta {
        margin-top: 6px;
        color: #71717a;
        font-size: 13px;
      }

      .read {
        flex-shrink: 0;
        color: #c4b5fd;
        font-size: 14px;
        font-weight: 600;
      }

      .reader-header {
        position: sticky;
        top: 0;
        z-index: 20;

        display: flex;
        align-items: center;
        gap: 16px;

        padding: 16px;

        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(10, 9, 16, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .reader-back {
        flex-shrink: 0;
        color: #a1a1aa;
        font-size: 14px;
      }

      .reader-title {
        min-width: 0;
        flex: 1;

        overflow: hidden;

        color: #e4e4e7;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .offline {
        flex-shrink: 0;
        color: #34d399;
        font-size: 12px;
        font-weight: 600;
      }

      .page {
        display: block;
        width: 100%;
        max-width: 768px;
        height: auto;
        margin: 0 auto;
      }

      .end {
        padding: 40px 16px 120px;
        color: #71717a;
        text-align: center;
      }

      .online-banner {
        position: fixed;
        right: 16px;
        bottom: 20px;
        left: 16px;
        z-index: 50;

        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 16px;

        width: min(calc(100% - 32px), 736px);
        margin: 0 auto;
        padding: 14px 16px;

        border: 1px solid rgba(52, 211, 153, 0.25);
        border-radius: 16px;

        background: rgba(17, 16, 23, 0.97);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .online-banner.visible {
        display: flex;
      }

      .online-message {
        min-width: 0;
      }

      .online-status {
        color: #34d399;
        font-size: 14px;
        font-weight: 600;
      }

      .online-description {
        margin-top: 2px;
        color: #71717a;
        font-size: 12px;
      }

      .online-button {
        flex-shrink: 0;

        padding: 9px 12px;

        border-radius: 10px;
        background: #8b5cf6;

        color: white;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="online-banner" class="online-banner">
      <div class="online-message">
        <div class="online-status">You're back online</div>
        <div class="online-description">
          Keep your place and continue online.
        </div>
      </div>

      <a id="continue-online" class="online-button" href="/">
        Continue online
      </a>
    </div>

    <script>
      const CACHE_NAME = "mangakai-chapters-v1";
      const METADATA_KEY = "mangakai-downloaded-chapters-v1";

      let currentPage = 0;
      let currentChapterId = null;
      let pageObserver = null;
      const objectUrls = [];

      function getChapters() {
        try {
          return JSON.parse(localStorage.getItem(METADATA_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function getChapter(chapterId) {
        return getChapters().find((chapter) => chapter.chapterId === chapterId);
      }

      function cleanupObjectUrls() {
        for (const url of objectUrls) {
          URL.revokeObjectURL(url);
        }

        objectUrls.length = 0;
      }

      function showOnlineBanner(chapterId) {
        const chapter = getChapter(chapterId);

        if (!chapter) return;

        const params = new URLSearchParams();

        if (chapter.mangaId) {
          params.set("manga", chapter.mangaId);
        }

        params.set("title", chapter.heading);
        params.set("page", String(currentPage));

        const link = document.getElementById("continue-online");

        link.href = `/read/${encodeURIComponent(chapterId)}?${params.toString()}`;

        document.getElementById("online-banner").classList.add("visible");
      }

      function hideOnlineBanner() {
        document.getElementById("online-banner").classList.remove("visible");
      }

      async function showLibrary() {
        cleanupObjectUrls();

        currentChapterId = null;
        currentPage = 0;

        if (pageObserver) {
          pageObserver.disconnect();
          pageObserver = null;
        }

        const app = document.getElementById("app");
        const chapters = getChapters();

        app.innerHTML = `
          <main class="container">
            <div class="brand">MangaKai</div>

            <h1>You're offline</h1>

            <p class="muted">
              You can still read chapters you downloaded earlier.
            </p>

            <div id="chapters"></div>
          </main>
        `;

        const list = document.getElementById("chapters");

        if (chapters.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <p>No downloaded chapters.</p>

              <p class="muted">
                Download a chapter while you're online and it will appear here.
              </p>
            </div>
          `;

          return;
        }

        for (const chapter of chapters) {
          const item = document.createElement("a");

          item.className = "chapter";
          item.href =
            "/offline.html?chapter=" + encodeURIComponent(chapter.chapterId);

          item.innerHTML = `
            <div style="min-width: 0">
              <div class="chapter-title"></div>

              <div class="chapter-meta">
                ${chapter.pageCount} pages
              </div>
            </div>

            <span class="read">Read →</span>
          `;

          item.querySelector(".chapter-title").textContent = chapter.heading;

          list.appendChild(item);
        }
      }

      async function showReader(chapterId) {
        cleanupObjectUrls();

        currentChapterId = chapterId;
        currentPage = 0;

        const app = document.getElementById("app");
        const chapter = getChapter(chapterId);

        app.innerHTML = `
          <header class="reader-header">
            <a class="reader-back" href="/offline.html">
              ← Downloads
            </a>

            <div class="reader-title"></div>

            <span class="offline">Offline</span>
          </header>

          <main id="pages">
            <p class="end">Loading downloaded chapter…</p>
          </main>
        `;

        document.querySelector(".reader-title").textContent =
          chapter?.heading || "Downloaded chapter";

        const pages = document.getElementById("pages");
        const cache = await caches.open(CACHE_NAME);

        pages.innerHTML = "";

        let index = 0;
        let found = false;

        while (true) {
          const response = await cache.match(
            `/offline/chapters/${chapterId}/${index}`,
          );

          if (!response) break;

          found = true;

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);

          objectUrls.push(url);

          const image = document.createElement("img");

          image.src = url;
          image.alt = `Page ${index + 1}`;
          image.className = "page";
          image.dataset.page = String(index);

          pages.appendChild(image);

          index += 1;
        }

        if (!found) {
          pages.innerHTML = `
            <div class="container">
              <div class="empty">
                This chapter isn't available offline.
              </div>
            </div>
          `;

          return;
        }

        pageObserver = new IntersectionObserver(
          (entries) => {
            let best = null;

            for (const entry of entries) {
              if (!entry.isIntersecting) continue;

              if (!best || entry.intersectionRatio > best.intersectionRatio) {
                best = entry;
              }
            }

            if (!best) return;

            const page = Number(best.target.dataset.page);

            if (Number.isInteger(page)) {
              currentPage = page;

              if (navigator.onLine) {
                showOnlineBanner(chapterId);
              }
            }
          },
          {
            threshold: [0.25, 0.5, 0.75],
          },
        );

        document.querySelectorAll(".page").forEach((image) => {
          pageObserver.observe(image);
        });

        const end = document.createElement("p");

        end.className = "end";
        end.textContent = "End of chapter";

        pages.appendChild(end);

        if (navigator.onLine) {
          showOnlineBanner(chapterId);
        }
      }

      window.addEventListener("online", () => {
        if (currentChapterId) {
          showOnlineBanner(currentChapterId);
        }
      });

      window.addEventListener("offline", () => {
        hideOnlineBanner();
      });

      window.addEventListener("beforeunload", () => {
        cleanupObjectUrls();

        if (pageObserver) {
          pageObserver.disconnect();
        }
      });

      const params = new URLSearchParams(location.search);
      const chapterId = params.get("chapter");

      if (chapterId) {
        void showReader(chapterId);
      } else {
        void showLibrary();
      }
    </script>
  </body>
</html>
