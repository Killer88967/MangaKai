<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=auto"
    />
    <meta name="theme-color" content="#0d0d0f" />

    <title>MangaKai Offline</title>

    <style>
      :root {
        color-scheme: dark;

        --background: #0d0d0f;
        --foreground: #f7f7f8;

        --surface: #151518;
        --surface-raised: #1b1b1f;
        --surface-hover: #222227;

        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.14);

        --muted: #a1a1aa;
        --subtle: #71717a;

        --brand: #8b5cf6;
        --brand-hover: #a78bfa;
        --brand-soft: rgba(139, 92, 246, 0.14);

        --success: #34d399;
        --danger: #f87171;

        background: var(--background);
        color: var(--foreground);

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;

        background: var(--background);
        color: var(--foreground);

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      a {
        touch-action: manipulation;
      }

      .shell {
        width: min(calc(100% - 32px), 1100px);
        margin: 0 auto;
        padding: 32px 0 100px;
      }

      .shell-series {
        width: min(calc(100% - 32px), 900px);
      }

      .eyebrow {
        margin: 0;

        color: var(--brand-hover);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .page-title {
        margin: 8px 0 0;

        color: white;
        font-size: clamp(30px, 6vw, 40px);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }

      .description {
        max-width: 580px;
        margin: 10px 0 0;

        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.7;
      }

      .library-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;

        margin-bottom: 32px;
        padding-bottom: 28px;

        border-bottom: 1px solid var(--border);
      }

      .stats {
        display: flex;
        gap: 20px;

        padding: 12px 16px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;

        background: var(--surface);
      }

      .stat-label {
        margin: 0;

        color: var(--subtle);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stat-value {
        margin: 3px 0 0;

        color: white;
        font-size: 18px;
        font-weight: 700;
      }

      .stat-divider {
        width: 1px;
        background: var(--border);
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;

        margin-bottom: 16px;
      }

      .section-title {
        margin: 0;

        color: #a1a1aa;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .section-meta {
        margin: 0;

        color: var(--subtle);
        font-size: 12px;
      }

      .catalog-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .catalog {
        display: flex;
        min-width: 0;
        gap: 16px;

        padding: 12px;

        border: 1px solid var(--border);
        border-radius: 16px;

        background: var(--surface);

        transition:
          border-color 160ms ease,
          background 160ms ease;
      }

      .catalog:active {
        background: var(--surface-hover);
      }

      .cover {
        position: relative;

        width: 76px;
        aspect-ratio: 2 / 3;

        flex-shrink: 0;

        overflow: hidden;

        border-radius: 12px;
        background: var(--surface-raised);
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        display: flex;
        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

        padding: 8px;

        color: var(--subtle);
        font-size: 10px;
        text-align: center;
      }

      .catalog-content {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;

        padding: 4px 0;
      }

      .catalog-title {
        display: -webkit-box;
        overflow: hidden;

        margin: 0;

        color: #f4f4f5;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;

        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .catalog-count {
        margin: 7px 0 0;

        color: var(--brand-hover);
        font-size: 14px;
        font-weight: 600;
      }

      .catalog-footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;

        margin-top: auto;
        padding-top: 16px;
      }

      .catalog-footer-copy {
        min-width: 0;
      }

      .catalog-footer-label {
        margin: 0;

        color: var(--subtle);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .catalog-latest {
        overflow: hidden;

        margin: 4px 0 0;

        color: #a1a1aa;
        font-size: 12px;

        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .catalog-arrow {
        flex-shrink: 0;

        color: #52525b;
        font-size: 18px;
      }

      .storage-note {
        margin: 20px 0 0;

        color: var(--subtle);
        font-size: 12px;
        line-height: 1.6;
      }

      .empty {
        display: flex;
        min-height: 340px;

        align-items: center;
        justify-content: center;

        padding: 24px;

        border: 1px dashed var(--border-strong);
        border-radius: 16px;

        background: rgba(21, 21, 24, 0.5);

        text-align: center;
      }

      .empty-inner {
        max-width: 360px;
      }

      .empty-icon {
        display: flex;
        width: 48px;
        height: 48px;

        align-items: center;
        justify-content: center;

        margin: 0 auto;

        border-radius: 16px;
        background: var(--brand-soft);

        color: var(--brand-hover);
        font-size: 20px;
      }

      .empty h2 {
        margin: 20px 0 0;

        color: white;
        font-size: 18px;
      }

      .empty p {
        margin: 8px 0 0;

        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.6;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        color: #a1a1aa;
        font-size: 14px;
      }

      .series-header {
        display: flex;
        gap: 20px;

        margin-top: 24px;
        padding-bottom: 28px;

        border-bottom: 1px solid var(--border);
      }

      .series-cover {
        width: 96px;
        aspect-ratio: 2 / 3;

        flex-shrink: 0;

        overflow: hidden;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;

        background: var(--surface-raised);
      }

      .series-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .series-info {
        min-width: 0;
        align-self: flex-end;
      }

      .series-title {
        display: -webkit-box;
        overflow: hidden;

        margin: 8px 0 0;

        color: white;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 1.1;

        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .series-count {
        margin: 8px 0 0;

        color: #a1a1aa;
        font-size: 14px;
      }

      .chapters {
        overflow: hidden;

        border: 1px solid var(--border);
        border-radius: 16px;

        background: var(--surface);
      }

      .chapter {
        display: flex;
        align-items: center;
        gap: 12px;

        padding: 16px;

        border-bottom: 1px solid var(--border);
      }

      .chapter:last-child {
        border-bottom: 0;
      }

      .chapter-info {
        min-width: 0;
        flex: 1;
      }

      .chapter-title {
        overflow: hidden;

        margin: 0;

        color: #f4f4f5;
        font-size: 14px;
        font-weight: 600;

        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chapter-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;

        margin-top: 5px;

        color: var(--subtle);
        font-size: 12px;
      }

      .chapter-actions {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 4px;
      }

      .read-button {
        padding: 8px 10px;

        border: 0;
        border-radius: 8px;
        background: transparent;

        color: var(--brand-hover);
        font-size: 14px;
        font-weight: 600;
      }

      .remove-button {
        padding: 8px 10px;

        border: 0;
        border-radius: 8px;
        background: transparent;

        color: #71717a;
        font-size: 17px;
      }

      .remove-button:active {
        background: rgba(248, 113, 113, 0.1);
        color: #fca5a5;
      }

      .danger-section {
        margin-top: 32px;
        padding-top: 24px;

        border-top: 1px solid var(--border);
      }

      .danger-button {
        padding: 10px 16px;

        border: 1px solid rgba(248, 113, 113, 0.2);
        border-radius: 12px;
        background: transparent;

        color: #fca5a5;
        font-size: 14px;
        font-weight: 600;
      }

      .danger-button:active {
        background: rgba(248, 113, 113, 0.1);
      }

      .danger-copy {
        margin: 10px 0 0;

        color: var(--subtle);
        font-size: 12px;
        line-height: 1.6;
      }

      .reader-header {
        position: sticky;
        top: 0;
        z-index: 20;

        display: flex;
        align-items: center;
        gap: 16px;

        padding: 14px 16px;

        border-bottom: 1px solid var(--border);

        background: rgba(13, 13, 15, 0.96);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .reader-back {
        flex-shrink: 0;

        color: #a1a1aa;
        font-size: 13px;
      }

      .reader-title {
        min-width: 0;
        flex: 1;

        overflow: hidden;

        color: #e4e4e7;
        font-size: 14px;
        font-weight: 600;
        text-align: center;

        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reader-status {
        flex-shrink: 0;

        color: var(--success);
        font-size: 12px;
        font-weight: 600;
      }

      .reader-page {
        display: block;
        width: 100%;
        max-width: 768px;
        height: auto;

        margin: 0 auto;
      }

      .reader-end {
        padding: 40px 16px 120px;

        color: var(--subtle);
        text-align: center;
      }

      .loading {
        padding: 80px 20px;

        color: var(--subtle);
        font-size: 14px;
        text-align: center;
      }

      .online-banner {
        position: fixed;
        right: 16px;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 16px;
        z-index: 50;

        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 16px;

        width: min(calc(100% - 32px), 736px);
        margin: 0 auto;
        padding: 14px 16px;

        border: 1px solid rgba(52, 211, 153, 0.25);
        border-radius: 16px;

        background: rgba(21, 21, 24, 0.98);

        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .online-banner.visible {
        display: flex;
      }

      .online-message {
        min-width: 0;
      }

      .online-status {
        color: var(--success);
        font-size: 14px;
        font-weight: 600;
      }

      .online-description {
        margin-top: 2px;

        color: var(--subtle);
        font-size: 12px;
      }

      .online-button {
        flex-shrink: 0;

        padding: 9px 12px;

        border-radius: 10px;
        background: var(--brand);

        color: white;
        font-size: 13px;
        font-weight: 600;
      }

      @media (min-width: 640px) {
        .shell {
          padding-top: 40px;
        }

        .catalog-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .catalog {
          padding: 16px;
        }

        .cover {
          width: 88px;
        }

        .series-cover {
          width: 128px;
        }

        .chapter {
          gap: 16px;
          padding: 16px 20px;
        }

        .chapter-title {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="online-banner" class="online-banner">
      <div class="online-message">
        <div class="online-status">You're back online</div>

        <div class="online-description">
          Keep your place and continue online.
        </div>
      </div>

      <a id="continue-online" class="online-button" href="/">
        Continue online
      </a>
    </div>

    <script>
      const CACHE_NAME = "mangakai-chapters-v1";
      const METADATA_KEY = "mangakai-downloaded-chapters-v1";

      let currentPage = 0;
      let currentChapterId = null;
      let pageObserver = null;

      const objectUrls = [];

      function getChapters() {
        try {
          const value = JSON.parse(localStorage.getItem(METADATA_KEY) || "[]");

          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function writeChapters(chapters) {
        localStorage.setItem(METADATA_KEY, JSON.stringify(chapters));
      }

      function getChapter(chapterId) {
        return getChapters().find((chapter) => chapter.chapterId === chapterId);
      }

      function getCatalogs() {
        const chapters = [...getChapters()].sort(
          (a, b) =>
            new Date(b.downloadedAt).getTime() -
            new Date(a.downloadedAt).getTime(),
        );

        const grouped = new Map();

        for (const chapter of chapters) {
          const mangaId = chapter.mangaId || `unknown:${chapter.chapterId}`;

          const existing = grouped.get(mangaId);

          if (existing) {
            existing.chapters.push(chapter);

            if (!existing.cover && chapter.mangaCover) {
              existing.cover = chapter.mangaCover;
            }

            if (existing.title === "Unknown series" && chapter.mangaTitle) {
              existing.title = chapter.mangaTitle;
            }

            continue;
          }

          grouped.set(mangaId, {
            mangaId,
            title: chapter.mangaTitle || "Unknown series",
            cover: chapter.mangaCover || null,
            chapters: [chapter],
          });
        }

        return Array.from(grouped.values()).sort((a, b) => {
          const aLatest = new Date(a.chapters[0]?.downloadedAt || 0).getTime();

          const bLatest = new Date(b.chapters[0]?.downloadedAt || 0).getTime();

          return bLatest - aLatest;
        });
      }

      function getCatalog(mangaId) {
        return getCatalogs().find((catalog) => catalog.mangaId === mangaId);
      }

      function cleanupObjectUrls() {
        for (const url of objectUrls) {
          URL.revokeObjectURL(url);
        }

        objectUrls.length = 0;
      }

      function formatDownloadedAt(value) {
        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return "Downloaded";
        }

        const options = {
          month: "short",
          day: "numeric",
        };

        if (date.getFullYear() !== new Date().getFullYear()) {
          options.year = "numeric";
        }

        return new Intl.DateTimeFormat(undefined, options).format(date);
      }

      function createCover(cover, title, className) {
        const wrapper = document.createElement("div");

        wrapper.className = className;

        if (cover) {
          const image = document.createElement("img");

          image.src = cover;
          image.alt = `${title} cover`;

          image.addEventListener("error", () => {
            wrapper.replaceChildren(createCoverPlaceholder());
          });

          wrapper.appendChild(image);

          return wrapper;
        }

        wrapper.appendChild(createCoverPlaceholder());

        return wrapper;
      }

      function createCoverPlaceholder() {
        const placeholder = document.createElement("div");

        placeholder.className = "cover-placeholder";
        placeholder.textContent = "No cover";

        return placeholder;
      }

      function resetReaderState() {
        cleanupObjectUrls();

        currentChapterId = null;
        currentPage = 0;

        if (pageObserver) {
          pageObserver.disconnect();
          pageObserver = null;
        }

        hideOnlineBanner();
      }

      function showOnlineBanner(chapterId) {
        const chapter = getChapter(chapterId);

        if (!chapter) return;

        const params = new URLSearchParams();

        if (chapter.mangaId) {
          params.set("manga", chapter.mangaId);
        }

        params.set("title", chapter.heading);

        if (chapter.mangaTitle) {
          params.set("series", chapter.mangaTitle);
        }

        if (chapter.mangaCover) {
          params.set("cover", chapter.mangaCover);
        }

        params.set("page", String(currentPage));

        const link = document.getElementById("continue-online");

        link.href = `/read/${encodeURIComponent(chapterId)}?${params.toString()}`;

        document.getElementById("online-banner").classList.add("visible");
      }

      function hideOnlineBanner() {
        document.getElementById("online-banner").classList.remove("visible");
      }

      async function deleteChapter(chapterId) {
        const cache = await caches.open(CACHE_NAME);
        const requests = await cache.keys();

        const prefix = new URL(
          `/offline/chapters/${chapterId}/`,
          location.origin,
        ).href;

        await Promise.all(
          requests
            .filter((request) => request.url.startsWith(prefix))
            .map((request) => cache.delete(request)),
        );

        writeChapters(
          getChapters().filter((chapter) => chapter.chapterId !== chapterId),
        );
      }

      async function deleteCatalog(mangaId) {
        const catalog = getCatalog(mangaId);

        if (!catalog) return;

        await Promise.all(
          catalog.chapters.map((chapter) => deleteChapter(chapter.chapterId)),
        );
      }

      function navigate(params = {}) {
        const search = new URLSearchParams();

        if (params.manga) {
          search.set("manga", params.manga);
        }

        if (params.chapter) {
          search.set("chapter", params.chapter);
        }

        const suffix = search.toString() ? `?${search.toString()}` : "";

        history.pushState(null, "", `/offline.html${suffix}`);

        void renderRoute();
      }

      async function showLibrary() {
        resetReaderState();

        document.title = "Downloads · MangaKai Offline";

        const app = document.getElementById("app");
        const catalogs = getCatalogs();

        const chapterCount = catalogs.reduce(
          (total, catalog) => total + catalog.chapters.length,
          0,
        );

        app.replaceChildren();

        const main = document.createElement("main");

        main.className = "shell";

        const header = document.createElement("header");

        header.className = "library-header";

        const headerCopy = document.createElement("div");

        const eyebrow = document.createElement("p");

        eyebrow.className = "eyebrow";
        eyebrow.textContent = "Offline library";

        const title = document.createElement("h1");

        title.className = "page-title";
        title.textContent = "Downloads";

        const description = document.createElement("p");

        description.className = "description";
        description.textContent =
          "Your downloaded manga, grouped by series and ready to read without an internet connection.";

        headerCopy.append(eyebrow, title, description);
        header.appendChild(headerCopy);

        if (catalogs.length > 0) {
          const stats = document.createElement("div");

          stats.className = "stats";

          stats.innerHTML = `
            <div>
              <p class="stat-label">Series</p>
              <p class="stat-value">${catalogs.length}</p>
            </div>

            <div class="stat-divider"></div>

            <div>
              <p class="stat-label">Chapters</p>
              <p class="stat-value">${chapterCount}</p>
            </div>
          `;

          header.appendChild(stats);
        }

        main.appendChild(header);

        if (catalogs.length === 0) {
          const empty = document.createElement("section");

          empty.className = "empty";

          empty.innerHTML = `
            <div class="empty-inner">
              <div class="empty-icon">↓</div>

              <h2>Nothing downloaded yet</h2>

              <p>
                Download chapters while you're online and their
                series will appear here automatically.
              </p>
            </div>
          `;

          main.appendChild(empty);
          app.appendChild(main);

          return;
        }

        const section = document.createElement("section");

        const heading = document.createElement("div");

        heading.className = "section-heading";

        heading.innerHTML = `
          <h2 class="section-title">Downloaded series</h2>
          <p class="section-meta">Stored on this device</p>
        `;

        const grid = document.createElement("div");

        grid.className = "catalog-grid";

        for (const catalog of catalogs) {
          const latest = catalog.chapters[0];

          const link = document.createElement("a");

          link.className = "catalog";
          link.href = `/offline.html?manga=${encodeURIComponent(
            catalog.mangaId,
          )}`;

          link.addEventListener("click", (event) => {
            event.preventDefault();

            navigate({
              manga: catalog.mangaId,
            });
          });

          const cover = createCover(catalog.cover, catalog.title, "cover");

          const content = document.createElement("div");

          content.className = "catalog-content";

          const mangaTitle = document.createElement("h3");

          mangaTitle.className = "catalog-title";
          mangaTitle.textContent = catalog.title;

          const count = document.createElement("p");

          count.className = "catalog-count";

          count.textContent =
            `${catalog.chapters.length} ` +
            `${
              catalog.chapters.length === 1 ? "chapter" : "chapters"
            } downloaded`;

          const footer = document.createElement("div");

          footer.className = "catalog-footer";

          const footerCopy = document.createElement("div");

          footerCopy.className = "catalog-footer-copy";

          const footerLabel = document.createElement("p");

          footerLabel.className = "catalog-footer-label";
          footerLabel.textContent = "Latest download";

          const latestTitle = document.createElement("p");

          latestTitle.className = "catalog-latest";
          latestTitle.textContent = latest?.heading || "Unknown chapter";

          const arrow = document.createElement("span");

          arrow.className = "catalog-arrow";
          arrow.textContent = "→";
          arrow.setAttribute("aria-hidden", "true");

          footerCopy.append(footerLabel, latestTitle);
          footer.append(footerCopy, arrow);

          content.append(mangaTitle, count, footer);
          link.append(cover, content);

          grid.appendChild(link);
        }

        const note = document.createElement("p");

        note.className = "storage-note";
        note.textContent =
          "Downloads are stored only on this device and browser. Removing site data will also remove downloaded chapters.";

        section.append(heading, grid, note);
        main.appendChild(section);

        app.appendChild(main);
      }

      async function showCatalog(mangaId) {
        resetReaderState();

        const catalog = getCatalog(mangaId);
        const app = document.getElementById("app");

        app.replaceChildren();

        if (!catalog) {
          document.title = "Not Found · MangaKai Offline";

          const main = document.createElement("main");

          main.className = "shell shell-series";

          const empty = document.createElement("section");

          empty.className = "empty";

          empty.innerHTML = `
            <div class="empty-inner">
              <h2>Downloaded series not found</h2>

              <p>
                Its downloaded chapters may have been removed
                from this device.
              </p>
            </div>
          `;

          main.appendChild(empty);
          app.appendChild(main);

          return;
        }

        document.title = `${catalog.title} · MangaKai Offline`;

        const main = document.createElement("main");

        main.className = "shell shell-series";

        const back = document.createElement("a");

        back.className = "back-link";
        back.href = "/offline.html";
        back.textContent = "← Downloads";

        back.addEventListener("click", (event) => {
          event.preventDefault();
          navigate();
        });

        main.appendChild(back);

        const header = document.createElement("header");

        header.className = "series-header";

        const cover = createCover(catalog.cover, catalog.title, "series-cover");

        const info = document.createElement("div");

        info.className = "series-info";

        const eyebrow = document.createElement("p");

        eyebrow.className = "eyebrow";
        eyebrow.textContent = "Offline catalog";

        const title = document.createElement("h1");

        title.className = "series-title";
        title.textContent = catalog.title;

        const count = document.createElement("p");

        count.className = "series-count";

        count.textContent =
          `${catalog.chapters.length} downloaded ` +
          `${catalog.chapters.length === 1 ? "chapter" : "chapters"}`;

        info.append(eyebrow, title, count);
        header.append(cover, info);
        main.appendChild(header);

        const section = document.createElement("section");

        section.style.marginTop = "32px";

        const sectionHeading = document.createElement("div");

        sectionHeading.className = "section-heading";

        sectionHeading.innerHTML = `
          <h2 class="section-title">Chapters</h2>
          <p class="section-meta">Available offline</p>
        `;

        const chapters = document.createElement("div");

        chapters.className = "chapters";

        for (const chapter of catalog.chapters) {
          const article = document.createElement("article");

          article.className = "chapter";

          const info = document.createElement("div");

          info.className = "chapter-info";

          const chapterTitle = document.createElement("h3");

          chapterTitle.className = "chapter-title";
          chapterTitle.textContent = chapter.heading;

          const meta = document.createElement("div");

          meta.className = "chapter-meta";

          const pages = document.createElement("span");

          pages.textContent = `${chapter.pageCount} pages`;

          const separator = document.createElement("span");

          separator.textContent = "·";
          separator.setAttribute("aria-hidden", "true");

          const date = document.createElement("span");

          date.textContent = formatDownloadedAt(chapter.downloadedAt);

          meta.append(pages, separator, date);
          info.append(chapterTitle, meta);

          const actions = document.createElement("div");

          actions.className = "chapter-actions";

          const read = document.createElement("a");

          read.className = "read-button";
          read.href = `/offline.html?chapter=${encodeURIComponent(
            chapter.chapterId,
          )}`;

          read.textContent = "Read";

          read.addEventListener("click", (event) => {
            event.preventDefault();

            navigate({
              chapter: chapter.chapterId,
            });
          });

          const remove = document.createElement("button");

          remove.type = "button";
          remove.className = "remove-button";
          remove.setAttribute("aria-label", `Remove ${chapter.heading}`);

          remove.textContent = "×";

          remove.addEventListener("click", async () => {
            if (!confirm(`Remove "${chapter.heading}" from downloads?`)) {
              return;
            }

            remove.disabled = true;
            remove.textContent = "…";

            await deleteChapter(chapter.chapterId);

            const refreshed = getCatalog(mangaId);

            if (!refreshed) {
              navigate();
              return;
            }

            await showCatalog(mangaId);
          });

          actions.append(read, remove);
          article.append(info, actions);
          chapters.appendChild(article);
        }

        section.append(sectionHeading, chapters);
        main.appendChild(section);

        const danger = document.createElement("section");

        danger.className = "danger-section";

        const removeAll = document.createElement("button");

        removeAll.type = "button";
        removeAll.className = "danger-button";

        removeAll.textContent =
          `Remove all ${catalog.chapters.length} ` +
          `${catalog.chapters.length === 1 ? "chapter" : "chapters"}`;

        removeAll.addEventListener("click", async () => {
          if (!confirm(`Remove all downloads for "${catalog.title}"?`)) {
            return;
          }

          removeAll.disabled = true;
          removeAll.textContent = "Removing downloads…";

          await deleteCatalog(mangaId);

          navigate();
        });

        const dangerCopy = document.createElement("p");

        dangerCopy.className = "danger-copy";

        dangerCopy.textContent =
          "This removes every downloaded chapter for this series from this device.";

        danger.append(removeAll, dangerCopy);
        main.appendChild(danger);

        app.appendChild(main);
      }

      async function showReader(chapterId) {
        resetReaderState();

        currentChapterId = chapterId;
        currentPage = 0;

        const app = document.getElementById("app");
        const chapter = getChapter(chapterId);

        document.title = `${chapter?.heading || "Downloaded chapter"} · MangaKai Offline`;

        app.innerHTML = `
          <header class="reader-header">
            <a class="reader-back" id="reader-back" href="/offline.html">
              ← Downloads
            </a>

            <div class="reader-title"></div>

            <span class="reader-status">Offline</span>
          </header>

          <main id="pages">
            <p class="loading">Loading downloaded chapter…</p>
          </main>
        `;

        const back = document.getElementById("reader-back");

        if (chapter?.mangaId) {
          back.href = `/offline.html?manga=${encodeURIComponent(
            chapter.mangaId,
          )}`;

          back.textContent = "← Chapters";
        }

        back.addEventListener("click", (event) => {
          event.preventDefault();

          if (chapter?.mangaId) {
            navigate({
              manga: chapter.mangaId,
            });
          } else {
            navigate();
          }
        });

        document.querySelector(".reader-title").textContent =
          chapter?.heading || "Downloaded chapter";

        const pages = document.getElementById("pages");
        const cache = await caches.open(CACHE_NAME);

        pages.innerHTML = "";

        let index = 0;
        let found = false;

        while (true) {
          const response = await cache.match(
            `/offline/chapters/${chapterId}/${index}`,
          );

          if (!response) break;

          found = true;

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);

          objectUrls.push(url);

          const image = document.createElement("img");

          image.src = url;
          image.alt = `Page ${index + 1}`;
          image.className = "reader-page";
          image.dataset.page = String(index);

          pages.appendChild(image);

          index += 1;
        }

        if (!found) {
          const wrapper = document.createElement("div");

          wrapper.className = "shell shell-series";

          const empty = document.createElement("div");

          empty.className = "empty";

          empty.innerHTML = `
            <div class="empty-inner">
              <h2>Chapter unavailable</h2>

              <p>
                This chapter's downloaded pages are no longer
                available on this device.
              </p>
            </div>
          `;

          wrapper.appendChild(empty);
          pages.appendChild(wrapper);

          return;
        }

        pageObserver = new IntersectionObserver(
          (entries) => {
            let best = null;

            for (const entry of entries) {
              if (!entry.isIntersecting) continue;

              if (!best || entry.intersectionRatio > best.intersectionRatio) {
                best = entry;
              }
            }

            if (!best) return;

            const page = Number(best.target.dataset.page);

            if (Number.isInteger(page)) {
              currentPage = page;

              if (navigator.onLine) {
                showOnlineBanner(chapterId);
              }
            }
          },
          {
            threshold: [0.25, 0.5, 0.75],
          },
        );

        document.querySelectorAll(".reader-page").forEach((image) => {
          pageObserver.observe(image);
        });

        const end = document.createElement("p");

        end.className = "reader-end";
        end.textContent = "End of chapter";

        pages.appendChild(end);

        if (navigator.onLine) {
          showOnlineBanner(chapterId);
        }
      }

      async function renderRoute() {
        const params = new URLSearchParams(location.search);

        const chapterId = params.get("chapter");
        const mangaId = params.get("manga");

        if (chapterId) {
          await showReader(chapterId);
          return;
        }

        if (mangaId) {
          await showCatalog(mangaId);
          return;
        }

        await showLibrary();
      }

      window.addEventListener("popstate", () => {
        void renderRoute();
      });

      window.addEventListener("online", () => {
        if (currentChapterId) {
          showOnlineBanner(currentChapterId);
        }
      });

      window.addEventListener("offline", () => {
        hideOnlineBanner();
      });

      window.addEventListener("beforeunload", () => {
        cleanupObjectUrls();

        if (pageObserver) {
          pageObserver.disconnect();
        }
      });

      void renderRoute();
    </script>
  </body>
</html>
